<!DOCTYPE html>
<html lang en>
  <head>
    <meta charset="utf-8"/>
    <link rel="icon" href="snowglobe.png">
    <title>my snowglobe</title>
    <link rel="stylesheet" href="style.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  </head>


  <body>
    <script src="script.js"></script>

    <div class="grid">
      <div class="left">
        <img class="flakies" src="Untitled September 29 2026 at 17.01.26.png">

      </div>
      <div class="middle" id="middle">
        <header class="hero">
          <h1>My Snowglobe</h1>
          <p class="kindness">Shake it for a little winder kindness! &#9825; &#10054; </p>
        </header>
        <main>
          <section class="globe-card">
            <div class="globe" id="globe">
              <img class="scene" src="snowglobe.png" alt="a snowglobe"/>
            </div>
            <button id="shake">shake the globe</button>
            <p class="message" id="message">press the button and see what settles</p>
          </section>
        </main>
      </div>
      <div class="right">
        <img class="flakies" src="Untitled September 29 2026 at 17.01.26.png">
      </div>
      
    </div>

    <p class="its_me">made by lausemaus, in the snow</p>

  </body>
</html>
