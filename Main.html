<!DOCTYPE html>
<html lang "en">
  <head>
    <meta charset="utf-8"/>
    <link rel="icon" href="snowglobe.png">
    <title>my snowglobe</title>
    <link rel="stylesheet" href="CSS/center.css"/>
    <link rel="stylesheet" href="CSS/flakes.css"/>
    <link rel="stylesheet" href="CSS/general.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

  </head>

  <body>
    <div class="grid">
      <div class="left">
        <img id="flakies" class="flakies" src="Images/Untitled September 29 2026 at 17.01.26.png" alt="a set of snowflakes on the left side of the screen">
        <img id="flakies" class="flakiesB" src="Images/Untitled September 29 2026 at 17.01.26.png" alt="a set of snowflakes on the left side of the screen">
      </div>
      <div class="middle" id="middle">
        <header class="hero">
          <h1>My Snowglobe</h1>
          <p class="kindness">Shake it for a little winter kindness! &#9825; &#10054; </p>
        </header>
        <section class="globe-card">
          <div class="globe" id="globe">
            <img class="scene" src="Images/snowglobe.png" alt="a snowglobe"/>
          </div>
          <button id="shake">shake the globe</button>
          <p class="message" id="message">Press the button and see what settles</p>
        </section>
      </div>
      <div class="right">
        <img id="flakies" class="flakies" src="Images/Untitled September 29 2026 at 17.01.26.png" alt="a set of snowflakes on the right side of the screen">
        <img id="flakies" class="flakiesB" src="Images/Untitled September 29 2026 at 17.01.26.png" alt="a set of snowflakes on the right side of the screen">
      </div>
      
    </div>

    <p class="its_me">made by lausemaus, in the snow</p>
    <script src="script.js"></script>

  </body>
</html>
