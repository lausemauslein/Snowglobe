<!DOCTYPE html>
<html lang en>
  <head>
    <meta charset="utf-8"/>
    <link rel="icon" href="snowglobe.png">
    <title>my snowglobe</title>
    <link rel="stylesheet" href="style.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  </head>


  <body>
    <div class="gird">
      <div class="right">
        
      </div>

      <div class="middle">
        <header class="hero">
          <h1>My Snowglobe</h1>
          <p class="kindness">Shake it for a little winder kindness! &#9825; &#10054; </p>
        </header>
        <main>
          <section class="globe-card">
            <div class="globe" id=globe>
              <img class="scene" src="snowglobe.png" alt="a snowglobe"/>
            </div>
            <button id="shake">shake the globe</button>
            <p class="message" id="message">press the button and see what settles</p>
          </section>
        </main>
      </div>

      <div class="left"></div>
      
    </div>

    <footer>
      <p>made by lausemaus, in the snow</p>
      <script src="script.js"></script>
    </footer>

  </body>
</html>
